name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: for f in *.zip; do unzip -o "$f"; done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar la app
        working-directory: GrabadorRapido
        run: gradle assembleDebug --no-daemon

      - name: Preparar APK
        run: cp GrabadorRapido/app/build/outputs/apk/debug/app-debug.apk GrabadorRapido.apk

      - name: Publicar para descargar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Grabador Rápido v${{ github.run_number }}
          files: GrabadorRapido.apk
